plugins { id 'com.android.application' }

android {
    namespace 'at.fotoupload.app'
    compileSdk 35
    buildToolsVersion '35.0.0'
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'at.fotoupload.app'
        minSdk 26
        targetSdk 35
        versionCode 11
        versionName '1.7.0'
    }
    signingConfigs {
        release {
            def keyFile = System.getenv('FOTO_UPLOAD_KEYSTORE')
            if (keyFile) {
                storeFile file(keyFile)
                storePassword System.getenv('FOTO_UPLOAD_STORE_PASSWORD')
                keyAlias System.getenv('FOTO_UPLOAD_KEY_ALIAS')
                keyPassword System.getenv('FOTO_UPLOAD_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            buildConfigField 'boolean', 'ALLOW_SIDELOAD_UPDATES', 'true'
        }
        release {
            minifyEnabled false
            buildConfigField 'boolean', 'ALLOW_SIDELOAD_UPDATES', 'false'
            if (System.getenv('FOTO_UPLOAD_KEYSTORE')) signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
}
