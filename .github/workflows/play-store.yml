name: Play-Store-Bundle erstellen
on: workflow_dispatch
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Upload-Schlüssel vorbereiten
        env:
          KEYSTORE: ${{ secrets.PLAY_KEYSTORE_BASE64 }}
        run: test -n "$KEYSTORE" && printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload.jks"
      - name: Signiertes App Bundle bauen
        env:
          FOTO_UPLOAD_KEYSTORE: ${{ runner.temp }}/upload.jks
          FOTO_UPLOAD_STORE_PASSWORD: ${{ secrets.PLAY_STORE_PASSWORD }}
          FOTO_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
          FOTO_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: foto-upload-play-bundle
          path: app/build/outputs/bundle/release/*.aab
