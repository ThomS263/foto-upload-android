name: Android build
on: [push, pull_request]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: foto-upload-debug
          path: app/build/outputs/apk/debug/*.apk
      - name: APK als GitHub Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk foto-upload-android.apk
          gh release create "$GITHUB_REF_NAME" foto-upload-android.apk --title "Foto-Upload Android $GITHUB_REF_NAME" --generate-notes
